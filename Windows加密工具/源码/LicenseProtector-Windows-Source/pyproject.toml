[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "license-protector"
version = "1.1.0"
requires-python = ">=3.11"
authors = [{name = "Stephen Hu", email = "stephenhu031028@gmail.com"}]
description = "Offline PHP source license protection tool"
dependencies = ["cryptography>=41"]

[project.scripts]
license-protector = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
